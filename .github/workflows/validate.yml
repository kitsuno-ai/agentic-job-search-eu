name: Validate sources

on:
  pull_request:
    paths:
      - 'sources/**/*.yml'
      - 'tools/validate.py'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'sources/**/*.yml'
      - 'tools/validate.py'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate all sources
        run: python tools/validate.py
