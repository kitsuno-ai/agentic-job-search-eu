rate_limits: |
  Public JSON and RSS endpoints. Pagination supported. No documented rate
  limit; conservative pacing recommended.

notes: |
  Remote-first aggregator covering tech, design, marketing, HR, customer
  support. Category filtering is strong. Listings mix direct employer posts
  with pass-throughs from other boards — a share of listings are duplicates
  of what you'd get on RemoteOK or Remotive. Useful as coverage-widener but
  not a primary source for any single sector.

