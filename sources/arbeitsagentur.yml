rate_limits: |
  Client credentials flow via OAuth2-style token exchange. Access quotas are
  generous but not infinite — production crawlers should batch requests and
  back off on any HTTP 429.

notes: |
  The German federal employment agency and authoritative source for German
  vacancies. Very large volume but not all listings are fresh — many stay up
  well past the actual application deadline. Use the listing publication date
  aggressively for freshness filtering. Description field is German-only for
  most listings, even when the role is English-speaking. Structured fields are
  excellent: standardized occupation codes (KldB 2010), employment type, working
  hours, contract duration, and explicit "befristet/unbefristet" flag.
  Geographic data is complete down to postal code.

