rate_limits: |
  Official APIs (Publisher / Employer) are tightly gated. Partner agreements
  required for large-scale access. Unofficial crawling via JobSpy and similar
  tools works but violates ToS — use at your own risk.

notes: |
  The largest job aggregator globally, with country-specific domains
  (indeed.de, indeed.fr, indeed.co.uk, etc.). Publisher API access has been
  progressively restricted since 2019 and is largely unavailable to new
  aggregators. Most modern crawlers access Indeed through the JobSpy library
  or browser-automation layers — both are ToS-restricted and can be blocked.
  Results include user-generated company reviews and apply-redirect behavior
  that complicates extraction. For EU-specific coverage, national public
  employment services (francetravail, platsbanken, nav, arbeitsagentur) are
  generally cleaner sources with better license posture.

