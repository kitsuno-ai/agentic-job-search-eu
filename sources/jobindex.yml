notes: |
  Denmark's dominant general job board. Strong private-sector coverage with
  some aggregation of public-sector roles. No public API for job search;
  listings are accessible via HTML pagination but ToS restricts automated
  access. On the wishlist because Denmark coverage is currently thin —
  NAV (Norway) and Platsbanken (Sweden) handle the other Nordics well, and
  integrating Jobindex would close the gap. Not yet pursued pending clarity
  on partnership / data-access options.

