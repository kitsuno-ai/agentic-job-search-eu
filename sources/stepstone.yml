notes: |
  One of the largest general job boards in DACH, especially strong for
  Germany and Austria. No public API documented for job aggregation.
  Listings are accessible via HTML but ToS restricts automated access —
  any integration requires either a partner agreement or extreme care
  on crawl rate and user-agent transparency. On the wishlist because
  DACH coverage would be materially improved by integrating StepStone;
  not yet pursued pending ToS/partnership clarification.

