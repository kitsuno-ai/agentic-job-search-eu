notes: |
  Romania's largest job board by a wide margin, and the one that matters
  if you want real RO coverage — OLX carries volume but far lower signal, and the
  IT-specific boards are narrow by design.

  A JSON API exists at api.ejobs.ro and returns well-structured records, but it is
  geo-restricted and rate-sensitive, so requests originating outside Romania are
  unreliable. Unique yield is high (~89%), which suggests genuine listing churn
  rather than a static board being re-read. Descriptions are Romanian-only for
  most postings even where the working language is English.

