notes: |
  Dedicated Swiss public-sector board — federal, cantonal, and municipal
  employers plus adjacent public entities (ETH, EPFL, public utilities).
  Listings are well-structured and nearly always show full salary bands
  following the Swiss public-sector classification system. Language of the
  listing follows the canton: DE for DE-Switzerland, FR for Romandie, IT
  for Ticino. Complete bilingual / trilingual listings are rare — expect
  one primary language per posting.

