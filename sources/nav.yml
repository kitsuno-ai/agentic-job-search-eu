rate_limits: |
  Public token available from https://pam-stilling-feed.nav.no/api/publicToken
  (rotates). Stable private tokens available by registering as a consumer
  (contact nav.team.arbeidsplassen@nav.no).

notes: |
  NAV is Norway's labour and welfare administration — Arbeidsplassen.nav.no
  is the vacancy-listing portal and authoritative feed for Norwegian jobs.
  Clean API with standardized STYRK occupation codes and geographic data
  down to kommune. Public token is rotating — works but the rotation schedule
  can interrupt long-running crawls. For production, request a stable
  private token. Listings mix Norwegian and English; larger employers
  (oil & gas, maritime, public sector) are increasingly English-friendly.

