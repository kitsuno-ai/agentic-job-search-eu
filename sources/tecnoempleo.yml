notes: |
  The main Spanish IT and technology job board. Spain is badly served by
  the general aggregators — Adzuna and Indeed carry Spanish volume but with poor
  role classification — so a dedicated tech source materially improves ES results.

  Presents an anti-bot challenge, so headless-browser handling is required.
  Pagination is a page parameter off /ofertas-trabajo/. Spanish-language
  descriptions with English common in multinational and remote-first postings.
  Madrid and Barcelona dominate; Valencia and Málaga are growing and now show
  meaningful volume.

