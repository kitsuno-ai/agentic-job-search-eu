rate_limits: |
  Basic key sufficient for moderate use. No public per-second limit published;
  exponential backoff recommended on any HTTP 429.

notes: |
  One of the largest UK-focused job boards. Well-structured API returning
  employer name, salary range, location (including WFH flag), and a short
  description. Full description requires following to reed.co.uk. Salary fields
  are usually filled when disclosed, but "Competitive" and empty salary are
  common — don't treat missing salary as meaningful signal. Location field mixes
  city names, county names, and the literal string "UK" — normalize if you care
  about geography. Employer tier affects how many listings come back per query.

