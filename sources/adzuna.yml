rate_limits: |
  Free tier: ~1,000 calls/month. Paid tiers for higher volumes.
  Per-country call counted separately — if crawling 20 countries, multiply accordingly.

notes: |
  Multi-country aggregator with per-country API endpoints. Each country needs
  its own API call — pagination is country-scoped. Listings are themselves
  aggregated from multiple underlying sources, so duplicate detection across
  Adzuna results is non-trivial. Salary fields are heuristically filled from
  the posting text and often wrong — treat salary as suggestive only.
  Description field is usually a few-sentence teaser; the canonical posting
  lives on the linked URL. Strong coverage for UK, DE, FR, PL; weaker for
  Nordics (use francetravail / platsbanken / nav directly instead).

