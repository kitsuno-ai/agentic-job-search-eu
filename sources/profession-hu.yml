notes: |
  Hungary's leading job board, and like Profesia.sk essentially the only
  route to genuine national coverage. Hungarian is a language barrier that keeps
  this market underrepresented in pan-European tooling — machine translation of
  descriptions is close to mandatory if your users do not read Hungarian.

  Straightforward extraction off /allasok/. Budapest dominates the listing volume
  heavily; regional coverage thins out fast outside the capital and Debrecen.
  Unique yield near 99%, though the source is recent enough that this has not
  been through a full listing lifecycle.

