notes: |
  Small curated board for remote roles that are actually open to
  European residents — which is the gap most remote boards leave, since the large
  ones are dominated by US postings that quietly require US work authorisation.
  Volume is modest but the EU-eligibility filter is done for you.

  Runs on WordPress and exposes the standard wp-json REST API, so the integration
  is trivial and stable: query the job-listings post type, page with per_page and
  orderby. Anti-bot handling is occasionally needed. Unique yield is high (~85%),
  consistent with a curated board that does not recycle listings.

