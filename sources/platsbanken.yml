rate_limits: |
  JobTech Dev is Sweden's open-data initiative for job data. Generous free
  access with reasonable rate limits; production use may warrant a registered
  client. Historical snapshots also available.

notes: |
  Swedish public employment service. Authoritative feed for Swedish vacancies
  via the Jobtech Dev open-data platform — likely the cleanest public-sector
  job API in Europe. Listings use standardized SSYK occupation codes
  (Swedish equivalent of ISCO). Both Swedish and English descriptions are
  common for tech/science roles; generalist listings default to Swedish. Full
  text of listings is provided — no need to follow URLs for description. ROME
  and ESCO crosswalks exist for SSYK codes.

