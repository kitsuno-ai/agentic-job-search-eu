notes: |
  Long-established US tech and engineering board. We do not reach it
  directly — Dice restricts automated access, so listings are discovered through a
  commercial Google-search API and followed to the posting. That means coverage is
  whatever the search index has, not the full board, and volume is a fraction of
  what a direct integration would give.

  Kept active because it is a cheap, low-maintenance read on the US tech market,
  which is useful as a comparison baseline. If you are building EU-only, skip it.

