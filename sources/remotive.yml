notes: |
  Curated remote-work board with lighter volume but higher average quality
  than RemoteOK. Each listing includes job type (full-time / freelance /
  contract / internship), salary range when available, and explicit region
  restrictions. Categories are cleaner than RemoteOK (software, product,
  marketing, etc.) which helps with filtering. Operator curates listings
  manually, so turnover is lower — same jobs can persist for weeks.

