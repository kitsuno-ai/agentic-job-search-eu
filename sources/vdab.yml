notes: |
  VDAB is the Flemish public employment service. Its onboarding guidance says
  vacancy data are restricted and not freely available. Access requires an
  application and VDAB approval; a cooperation agreement may be required before
  access is granted. Do not crawl or use vacancy data without authorization.
  The exact authentication mechanism was not independently verified because
  the developer portal requires access. Developer documentation describes
  vacancy search, change and bulk-query
  APIs, but the referenced portal requires access and was not independently
  readable during this review. No listing volume or update cadence is asserted.

