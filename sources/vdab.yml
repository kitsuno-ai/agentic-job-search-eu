notes: |
  VDAB is the public employment service for Flanders only; Brussels (Actiris)
  and Wallonia (Le Forem) are separate public employment services. Its
  onboarding guidance states vacancy data are restricted and not freely
  available. Access requires an application, approval, and potentially a
  cooperation agreement before credentials are issued. Do not crawl or use
  vacancy data without authorization. Developer documentation describes vacancy
  search, change, and bulk-query APIs, but the portal requires authenticated
  access and could not be independently verified during review. No listing volume
  or update cadence is asserted.

