notes: |
  ReliefWeb is the UN Office for the Coordination of Humanitarian Affairs
  (OCHA) information service. The jobs feed aggregates postings from UN
  agencies (UNDP, UNICEF, WHO, OHCHR etc.), major INGOs (Save the Children,
  MSF, IRC, Oxfam), and Red Cross/Red Crescent movements. Listings are
  well-structured with career-category taxonomy, theme tags, country and
  city fields, and closing dates. Descriptions are often long and formatted.
  Genuinely unique niche — no other source catalogs this sector as cleanly.

