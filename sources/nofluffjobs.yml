notes: |
  Polish-founded tech board, now with meaningful CZ, SK and HU coverage.
  The standout on data quality: mandatory salary ranges on every posting, plus
  structured tech stacks with required-versus-nice-to-have split and seniority.
  Very little European hiring data is this clean.

  A JSON search API is reachable at /api/search/posting with an unauthenticated
  pageTo/pageSize/salaryCurrency contract, and per-posting detail at
  /api/posting/<id>. Unique yield is the highest of any high-volume source we run,
  around 88% against roughly 2.0M found — real churn, not a re-read. If you are
  building anything that reasons about compensation in CEE, start here.

