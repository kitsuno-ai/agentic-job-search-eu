notes: |
  Poland's largest general job board. Where NoFluffJobs covers tech with
  excellent structure, this covers everything else with more volume and less
  structure — the two together give strong Polish coverage.

  Presents an anti-bot challenge, so headless-browser handling is required.
  Pagination is a simple page-number parameter off /praca. Polish-language
  descriptions dominate; salary is present on a minority of listings, in sharp
  contrast to the Polish tech boards where it is mandatory.

