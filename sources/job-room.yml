notes: |
  The Swiss public employment service platform, operated by SECO and the
  cantonal RAV offices. Structurally important rather than merely large: under the
  Swiss job-registration duty (Stellenmeldepflicht), employers must register
  vacancies in occupations with above-threshold unemployment here first, with a
  head-start period before they may be advertised elsewhere.

  That makes job-room a genuine early-warning surface — roles appear here before
  jobs.ch in the affected occupation categories. Public-sector data, no
  authentication, and covers all four language regions. If you are building for
  Switzerland, this belongs in your first three sources, not your long tail.

