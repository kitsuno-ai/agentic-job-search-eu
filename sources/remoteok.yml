rate_limits: |
  Public JSON endpoint. No documented rate limit; conservative pacing
  recommended. Single JSON payload contains all current listings (no
  pagination required).

notes: |
  Remote-first job board skewed toward tech, design, and marketing. Listings
  are short and tag-rich — tech stack, region restrictions ("USA-only",
  "EU-timezone"), and remote type (fully remote vs. hybrid) are well
  structured. Single JSON response makes crawling trivially cheap — no
  pagination state to maintain. Employer validation is light, so occasional
  low-quality listings slip through. Operated by Pieter Levels, long-standing
  fixture of the remote-work community.

